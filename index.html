<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description"
    content="QR-based physical box inventory tracker — scan, search and update stock in real time." />
  <title>BoxTrack · QR Inventory</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="app">
    <header class="app-header no-print">
      <div class="app-logo">&#128230;</div>
      <div>
        <div class="app-title">BoxTrack</div>
        <div class="app-subtitle">QR Inventory System</div>
      </div>
    </header>
    <main id="main"></main>
  </div>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Modal backdrop -->
  <div id="modal-backdrop" class="modal-backdrop" onclick="closeModal()"></div>

  <!-- Add Product bottom sheet -->
  <div id="add-product-sheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Add Product to Box</div>
    <div class="sheet-subtitle" id="sheet-box-label">Adding to BOX-01</div>

    <div class="input-wrap">
      <label class="input-label" for="ap-name">Product Name</label>
      <input class="input-field" id="ap-name" type="text" placeholder="e.g. Widget Gamma" autocomplete="off"
        spellcheck="false" maxlength="64" />
    </div>
    <div class="input-wrap">
      <label class="input-label" for="ap-qty">Initial Quantity</label>
      <input class="input-field" id="ap-qty" type="number" placeholder="0" min="0" max="99999" value="0" />
    </div>
    <div style="height:4px"></div>
    <button class="btn btn-teal" id="ap-submit-btn" onclick="submitAddProduct()">
      &#43; Add Product
    </button>
    <div style="height:10px"></div>
    <button class="btn btn-outline" onclick="closeModal()" style="min-height:44px;font-size:0.875rem">
      Cancel
    </button>
  </div>

  <!-- Print-only label -->
  <div id="print-label" class="print-label" style="display:none">
    <div id="qrcode-print"></div>
    <div class="print-box-id" id="print-box-id-text"></div>
  </div>

  <script>
    /* ─────────────────────────────────────────────
       CONFIG  — replace with your deployed GAS URL
    ───────────────────────────────────────────── */
    const CONFIG = {
      GAS_URL: 'https://script.google.com/macros/s/AKfycby4WtnFJFv8VYUvIt4G8cctEjpTsSXAp4KhE8pbnp28tyTJYmApF_Z0UkUviQOfCZ4/exec',
      LOW_STOCK_THRESHOLD: 5,
    };

    /* ─────────────────────────────────────────────
       UTILS
    ───────────────────────────────────────────── */
    const $ = (sel, ctx) => (ctx || document).querySelector(sel);
    const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

    function getParam(key) { return new URLSearchParams(window.location.search).get(key); }

    let toastTimer = null;
    function toast(msg, type) {
      type = type || 'info';
      const el = $('#toast');
      const icons = { success: '&#10003;', error: '&#10007;', info: 'i', loading: '&#8987;' };
      el.innerHTML = '<span>' + (icons[type] || 'i') + '</span><span>' + msg + '</span>';
      el.className = 'show ' + type;
      clearTimeout(toastTimer);
      if (type !== 'loading') toastTimer = setTimeout(function () { el.className = ''; }, 3000);
    }

    function qtyClass(qty) {
      if (qty === 0) return 'zero';
      if (qty <= CONFIG.LOW_STOCK_THRESHOLD) return 'low';
      return '';
    }

    function escHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function highlightMatch(text, query) {
      if (!query) return escHtml(text);
      var escaped = escHtml(text);
      var escapedQ = escHtml(query);
      var re = new RegExp('(' + escapedQ.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return escaped.replace(re, '<mark class="highlight">$1</mark>');
    }

    /* ─────────────────────────────────────────────
       MODAL
    ───────────────────────────────────────────── */
    function openModal(sheetId) {
      $('#modal-backdrop').classList.add('open');
      $('#' + sheetId).classList.add('open');
    }

    function closeModal() {
      $('#modal-backdrop').classList.remove('open');
      $$('.bottom-sheet').forEach(function (s) { s.classList.remove('open'); });
    }

    /* ─────────────────────────────────────────────
       ROUTER
    ───────────────────────────────────────────── */
    function route() {
      var boxId = getParam('box');
      if (boxId) {
        document.title = boxId + ' \u00B7 BoxTrack';
        initScanMode(boxId.toUpperCase());
      } else {
        initHomeMode();
      }
    }

    /* ─────────────────────────────────────────────
       HOME MODE  (tabs: Generate | Scan | Search)
    ───────────────────────────────────────────── */
    var _activeTab = 'generate';

    function initHomeMode() {
      var main = $('#main');
      main.innerHTML = [
        '<nav class="tab-nav no-print">',
        '<button class="tab-btn active" id="tab-btn-generate" onclick="showTab(\'generate\')">',
        '<span class="tab-icon">&#9889;</span>Generate',
        '</button>',
        '<button class="tab-btn" id="tab-btn-scan" onclick="showTab(\'scan\')">',
        '<span class="tab-icon">&#128247;</span>Scan QR',
        '</button>',
        '<button class="tab-btn" id="tab-btn-search" onclick="showTab(\'search\')">',
        '<span class="tab-icon">&#128269;</span>Search',
        '</button>',
        '</nav>',
        '<div id="tab-content"></div>'
      ].join('');

      showTab('generate');
    }

    function showTab(name) {
      _activeTab = name;
      $$('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      var btn = $('#tab-btn-' + name);
      if (btn) btn.classList.add('active');

      // Stop camera if leaving scan tab
      if (name !== 'scan') stopScanner();

      var content = $('#tab-content');
      if (name === 'generate') renderGenerateTab(content);
      else if (name === 'scan') renderScannerTab(content);
      else if (name === 'search') renderSearchTab(content);
    }

    /* ─────────────────────────────────────────────
       TAB: GENERATE QR
    ───────────────────────────────────────────── */
    var _currentQR = null;

    function renderGenerateTab(container) {
      container.innerHTML = [
        '<div class="card fade-in">',
        '<div class="card-title">Generate Box QR Code</div>',
        '<div class="input-wrap">',
        '<label class="input-label" for="box-id-input">Box ID</label>',
        '<input class="input-field" id="box-id-input" type="text"',
        ' placeholder="e.g. BOX-01" autocomplete="off" autocorrect="off"',
        ' autocapitalize="characters" spellcheck="false" maxlength="32" />',
        '</div>',
        '<button class="btn btn-primary" onclick="generateQR()">&#9889; Generate QR Code</button>',
        '</div>',
        '<div id="qr-result" style="display:none">',
        '<div class="card">',
        '<div class="qr-wrap">',
        '<div id="qrcode-output"></div>',
        '<div class="qr-label-info" id="qr-box-label"></div>',
        '<div class="qr-url-hint" id="qr-url-hint"></div>',
        '</div>',
        '</div>',
        '<button class="btn btn-outline no-print" onclick="printLabel()" style="margin-bottom:10px">',
        '&#128424; Print QR Label',
        '</button>',
        '</div>'
      ].join('');

      $('#box-id-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') generateQR();
      });
    }

    function generateQR() {
      var input = $('#box-id-input');
      var rawId = input.value.trim().toUpperCase();
      if (!rawId) { input.focus(); toast('Please enter a Box ID', 'error'); return; }

      var url = window.location.origin + window.location.pathname + '?box=' + encodeURIComponent(rawId);
      var outputEl = $('#qrcode-output');
      outputEl.innerHTML = '';
      if (_currentQR) { try { _currentQR.clear(); } catch (e) { } }

      _currentQR = new QRCode(outputEl, {
        text: url, width: 200, height: 200,
        colorDark: '#000000', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });

      $('#qr-box-label').textContent = rawId;
      $('#qr-url-hint').textContent = url;
      var resultEl = $('#qr-result');
      resultEl.style.display = 'block';
      resultEl.classList.add('fade-in');
      setTimeout(function () { resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
    }

    function printLabel() {
      var input = $('#box-id-input');
      if (!input) return;
      var boxId = input.value.trim().toUpperCase();
      if (!boxId) return;
      var url = window.location.origin + window.location.pathname + '?box=' + encodeURIComponent(boxId);
      var printEl = $('#qrcode-print');
      var printLabelEl = $('#print-label');
      printEl.innerHTML = '';
      printLabelEl.style.display = 'flex';
      new QRCode(printEl, { text: url, width: 98, height: 98, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
      $('#print-box-id-text').textContent = boxId;
      setTimeout(function () { window.print(); }, 250);
    }

    /* ─────────────────────────────────────────────
       TAB: QR SCANNER  (BarcodeDetector API)
    ───────────────────────────────────────────── */
    var _scanStream = null;
    var _scanInterval = null;
    var _scanDetected = false;

    function renderScannerTab(container) {
      var supported = 'BarcodeDetector' in window;
      container.innerHTML = [
        '<div class="card fade-in" style="padding:16px">',
        '<div class="card-title" style="margin-bottom:10px">Scan Box QR Code</div>',
        supported
          ? [
            '<div class="scanner-wrap">',
            '<video id="scanner-video" autoplay muted playsinline></video>',
            '<div class="scanner-overlay">',
            '<div class="scanner-frame">',
            '<div class="scanner-frame-corner-tr"></div>',
            '<div class="scanner-frame-corner-bl"></div>',
            '<div class="scanner-line"></div>',
            '</div>',
            '</div>',
            '</div>',
            '<p class="scanner-status" id="scanner-status">Point camera at a BoxTrack QR code&hellip;</p>',
            '<div style="height:12px"></div>',
            '<button class="btn btn-primary" id="scanner-start-btn" onclick="startScanner()">&#128247; Start Camera</button>',
            '<div style="height:8px"></div>',
            '<button class="btn btn-outline" onclick="stopScanner()" style="min-height:44px">&#9646; Stop Camera</button>',
          ].join('')
          : [
            '<div class="notice">',
            '<span style="font-size:1.3rem">&#128247;</span>',
            '<div>',
            '<strong>Camera scanning not supported</strong><br>',
            '<span style="color:var(--text-dim)">Use Google Lens, iOS Camera, or Android camera app to scan QR codes directly. Or use the file input below.</span>',
            '</div>',
            '</div>',
            '<div style="height:12px"></div>',
            '<label class="btn btn-primary" style="cursor:pointer">',
            '&#128444; Scan from Image',
            '<input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanFromFile(event)">',
            '</label>',
          ].join(''),
        '</div>'
      ].join('');
    }

    async function startScanner() {
      if (!('BarcodeDetector' in window)) return;
      _scanDetected = false;
      var statusEl = $('#scanner-status');
      var startBtn = $('#scanner-start-btn');
      try {
        _scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        var video = $('#scanner-video');
        video.srcObject = _scanStream;
        if (startBtn) startBtn.style.display = 'none';
        if (statusEl) statusEl.textContent = 'Scanning\u2026 hold camera steady';

        var detector = new BarcodeDetector({ formats: ['qr_code'] });
        _scanInterval = setInterval(async function () {
          if (_scanDetected) return;
          try {
            var codes = await detector.detect(video);
            if (codes.length > 0) {
              var raw = codes[0].rawValue;
              var boxId = extractBoxId(raw);
              if (boxId) {
                _scanDetected = true;
                stopScanner();
                if (statusEl) {
                  statusEl.innerHTML = '<span class="scanner-detected">&#10003; Detected: ' + escHtml(boxId) + '</span>';
                }
                setTimeout(function () {
                  window.location.href = window.location.pathname + '?box=' + encodeURIComponent(boxId);
                }, 600);
              }
            }
          } catch (e) { }
        }, 400);
      } catch (err) {
        if (statusEl) statusEl.textContent = 'Camera access denied. Enable camera permissions and try again.';
      }
    }

    function stopScanner() {
      if (_scanInterval) { clearInterval(_scanInterval); _scanInterval = null; }
      if (_scanStream) { _scanStream.getTracks().forEach(function (t) { t.stop(); }); _scanStream = null; }
      var video = $('#scanner-video');
      if (video) { video.srcObject = null; }
    }

    function extractBoxId(raw) {
      try {
        var url = new URL(raw);
        return url.searchParams.get('box');
      } catch (e) {
        // Maybe raw value is just the box ID itself
        if (/^[A-Z0-9\-_]{2,20}$/i.test(raw.trim())) return raw.trim().toUpperCase();
        return null;
      }
    }

    function scanFromFile(event) {
      var file = event.target.files[0];
      if (!file) return;
      if (!('BarcodeDetector' in window)) { toast('BarcodeDetector not available', 'error'); return; }
      var img = new Image();
      img.onload = async function () {
        try {
          var detector = new BarcodeDetector({ formats: ['qr_code'] });
          var codes = await detector.detect(img);
          if (codes.length > 0) {
            var boxId = extractBoxId(codes[0].rawValue);
            if (boxId) {
              window.location.href = window.location.pathname + '?box=' + encodeURIComponent(boxId);
            } else {
              toast('No BoxTrack QR found in image', 'error');
            }
          } else {
            toast('No QR code detected', 'error');
          }
        } catch (e) { toast('Error reading image', 'error'); }
      };
      img.src = URL.createObjectURL(file);
    }

    /* ─────────────────────────────────────────────
       TAB: SEARCH
    ───────────────────────────────────────────── */
    var _allInventory = null; // cached from GAS
    var _searchDebounce = null;

    function renderSearchTab(container) {
      container.innerHTML = [
        '<div class="search-wrap fade-in">',
        '<span class="search-icon">&#128269;</span>',
        '<input class="search-field" id="search-input" type="search"',
        ' placeholder="Search products, boxes\u2026" autocomplete="off" />',
        '</div>',
        '<div id="search-results">',
        '<div class="empty-state" style="padding:32px 0">',
        '<div class="icon">&#128269;</div>',
        '<p>Type to search across all inventory</p>',
        '</div>',
        '</div>'
      ].join('');

      $('#search-input').addEventListener('input', function (e) {
        clearTimeout(_searchDebounce);
        var q = e.target.value.trim();
        if (!q) {
          $('#search-results').innerHTML = '<div class="empty-state" style="padding:32px 0"><div class="icon">&#128269;</div><p>Type to search across all inventory</p></div>';
          return;
        }
        _searchDebounce = setTimeout(function () { performSearch(q); }, 280);
      });
    }

    async function performSearch(query) {
      var resultsEl = $('#search-results');
      if (!resultsEl) return;

      // Show loading
      resultsEl.innerHTML = [
        '<div class="skeleton skel-row" style="margin-bottom:10px"></div>',
        '<div class="skeleton skel-row" style="margin-bottom:10px"></div>',
        '<div class="skeleton skel-row"></div>'
      ].join('');

      // Fetch all inventory once and cache
      if (!_allInventory) {
        try {
          var res = await fetch(CONFIG.GAS_URL + '?action=all');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var data = await res.json();
          if (data.error) throw new Error(data.error);
          _allInventory = data.rows || [];
        } catch (err) {
          resultsEl.innerHTML = '<div class="error-banner"><span style="font-size:1.3rem">&#9888;</span><div><strong>Search failed</strong><br><span style="color:var(--text-dim)">' + escHtml(err.message) + '</span></div></div>';
          return;
        }
      }

      var q = query.toLowerCase();
      // Group results by box
      var boxMap = {};
      _allInventory.forEach(function (row) {
        var matchBox = (row.boxId || '').toLowerCase().includes(q);
        var matchName = (row.name || '').toLowerCase().includes(q);
        var matchLoc = (row.location || '').toLowerCase().includes(q);
        if (matchBox || matchName || matchLoc) {
          if (!boxMap[row.boxId]) boxMap[row.boxId] = { location: row.location, products: [] };
          boxMap[row.boxId].products.push(row);
        }
      });

      var keys = Object.keys(boxMap);
      if (keys.length === 0) {
        resultsEl.innerHTML = '<div class="empty-state" style="padding:32px 0"><div class="icon">&#128269;</div><p>No results for &ldquo;' + escHtml(query) + '&rdquo;</p></div>';
        return;
      }

      var html = keys.map(function (boxId) {
        var box = boxMap[boxId];
        var productRows = box.products.map(function (p) {
          var cls = qtyClass(p.qty);
          return [
            '<div class="search-result-product">',
            '<div style="flex:1;min-width:0">',
            '<div style="font-size:0.95rem;font-weight:600">' + highlightMatch(p.name, query) + '</div>',
            '</div>',
            '<div class="product-qty ' + cls + '" style="font-size:1.1rem">' + p.qty + '</div>',
            '</div>'
          ].join('');
        }).join('');

        return [
          '<div class="search-result-box">',
          '<div class="search-result-box-header" onclick="goToBox(\'' + escHtml(boxId) + '\')">',
          '<div>',
          '<div class="search-result-box-id">' + highlightMatch(boxId, query) + '</div>',
          '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px">&#128205; ' + escHtml(box.location) + '</div>',
          '</div>',
          '<span style="color:var(--accent);font-size:0.8rem;font-weight:600">View &#8594;</span>',
          '</div>',
          productRows,
          '</div>'
        ].join('');
      }).join('');

      resultsEl.innerHTML = [
        '<div style="font-size:0.78rem;color:var(--text-dim);margin-bottom:10px">',
        keys.length + ' box' + (keys.length !== 1 ? 'es' : '') + ' matched',
        '</div>',
        html
      ].join('');
    }

    function goToBox(boxId) {
      stopScanner();
      window.location.href = window.location.pathname + '?box=' + encodeURIComponent(boxId);
    }

    /* ─────────────────────────────────────────────
       SCAN MODE  (?box=BOX-01)
    ───────────────────────────────────────────── */
    async function initScanMode(boxId) {
      var main = $('#main');
      // Back button
      main.innerHTML = [
        '<button class="btn btn-outline no-print" onclick="window.location.href=\'/\'" style="min-height:40px;font-size:0.82rem;margin-bottom:12px;width:auto;padding:0 14px">',
        '&#8592; Home',
        '</button>',
        '<div class="skeleton skel-box fade-in"></div>',
        '<div class="section-header no-print">',
        '<span class="section-title">Products</span>',
        '</div>',
        '<div class="product-list">',
        '<div class="skeleton skel-row" style="margin-bottom:10px"></div>',
        '<div class="skeleton skel-row" style="margin-bottom:10px"></div>',
        '<div class="skeleton skel-row" style="margin-bottom:10px"></div>',
        '</div>'
      ].join('');

      var boxData;
      try {
        var res = await fetch(CONFIG.GAS_URL + '?box=' + encodeURIComponent(boxId));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        boxData = await res.json();
        if (boxData.error) throw new Error(boxData.error);
      } catch (err) {
        main.innerHTML = [
          '<button class="btn btn-outline no-print" onclick="window.location.href=\'/\'" style="min-height:40px;font-size:0.82rem;margin-bottom:12px;width:auto;padding:0 14px">&#8592; Home</button>',
          '<div class="error-banner fade-in">',
          '<span style="font-size:1.3rem">&#9888;&#65039;</span>',
          '<div>',
          '<strong>Could not load box data</strong><br>',
          '<span style="color:var(--text-dim)">' + escHtml(err.message) + '</span><br>',
          '<small style="color:var(--text-dim);margin-top:4px;display:block">Make sure GAS_URL is set and deployed as "Anyone" accessible.</small>',
          '</div>',
          '</div>',
          '<div style="height:12px"></div>',
          '<button class="btn btn-outline" onclick="initScanMode(\'' + escHtml(boxId) + '\')">&#8634; Retry</button>'
        ].join('');
        return;
      }

      renderScanView(boxId, boxData);
    }

    function renderScanView(boxId, boxData) {
      var main = $('#main');
      var location = boxData.location || '\u2014';
      var products = boxData.products || [];

      var rows = products.length === 0
        ? '<div class="empty-state fade-in"><div class="icon">&#128451;</div><p>No products in this box yet.<br>Tap &#43; to add the first one.</p></div>'
        : '<div class="product-list fade-in" id="product-list">' +
        products.map(function (p, i) { return renderProductRow(p, i, false); }).join('') +
        '</div>';

      var actionBar = '<div class="action-bar no-print" id="action-bar">' +
        (products.length > 0
          ? '<button class="btn btn-primary" id="checkout-btn" onclick="enterEditMode()">&#9998; Checkout / Update Stock</button>'
          : '<button class="btn btn-outline" style="opacity:0.5" disabled>No products to update</button>'
        ) +
        '</div>';

      main.innerHTML = [
        '<button class="btn btn-outline no-print" onclick="window.location.href=window.location.pathname" style="min-height:40px;font-size:0.82rem;margin-bottom:12px;width:auto;padding:0 14px">',
        '&#8592; Home',
        '</button>',
        '<div class="box-hero fade-in">',
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">',
        '<div>',
        '<div style="font-size:0.72rem;font-weight:600;letter-spacing:0.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Box</div>',
        '<div class="box-id">' + escHtml(boxId) + '</div>',
        '</div>',
        '<span class="badge badge-purple">&#128205; ' + escHtml(location) + '</span>',
        '</div>',
        '<div class="divider" style="margin:12px 0 10px"></div>',
        '<div style="display:flex;gap:10px;flex-wrap:wrap">',
        '<span class="badge badge-green">&#128230; ' + products.length + ' Product' + (products.length !== 1 ? 's' : '') + '</span>',
        '<span class="badge badge-amber">&#128336; ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</span>',
        '</div>',
        '</div>',
        '<div class="section-header no-print">',
        '<span class="section-title">Products</span>',
        '<span style="font-size:0.75rem;color:var(--text-dim)">' + products.length + ' item' + (products.length !== 1 ? 's' : '') + '</span>',
        '</div>',
        rows,
        actionBar
      ].join('');

      // FAB — Add Product
      var fab = document.createElement('button');
      fab.className = 'fab no-print';
      fab.id = 'add-product-fab';
      fab.title = 'Add Product';
      fab.innerHTML = '&#43;';
      fab.onclick = function () { openAddProductSheet(boxId, location); };
      document.body.appendChild(fab);

      window._boxData = { boxId: boxId, location: location, products: products.map(function (p) { return Object.assign({}, p); }) };
      window._editing = false;
      window._deltas = {};
    }

    /* ─── Product rows ─── */
    function renderProductRow(product, index, editing) {
      var name = product.name, qty = product.qty;
      var delta = (window._deltas || {})[index] || 0;
      var newQty = qty + delta;
      var cls = qtyClass(newQty);

      if (!editing) {
        return [
          '<div class="product-row" data-index="' + index + '">',
          '<div class="product-info">',
          '<div class="product-name">' + escHtml(name) + '</div>',
          '</div>',
          '<div class="product-qty ' + cls + '">' + qty + '</div>',
          '</div>'
        ].join('');
      }

      return [
        '<div class="product-row editing" data-index="' + index + '">',
        '<div class="product-info">',
        '<div class="product-name">' + escHtml(name) + '</div>',
        '</div>',
        '<div class="product-counter">',
        '<button class="btn btn-icon btn-dec" aria-label="Decrease ' + escHtml(name) + '" onclick="adjustDelta(' + index + ',-1)">&minus;</button>',
        '<span class="counter-val ' + cls + '" id="counter-' + index + '">' + newQty + '</span>',
        '<button class="btn btn-icon btn-inc" aria-label="Increase ' + escHtml(name) + '" onclick="adjustDelta(' + index + ',1)">+</button>',
        '</div>',
        '</div>'
      ].join('');
    }

    function enterEditMode() {
      window._editing = true;
      window._deltas = {};
      refreshProductList();
      var fab = $('#add-product-fab');
      if (fab) fab.style.display = 'none';
      var bar = $('#action-bar');
      if (bar) bar.innerHTML = [
        '<button class="btn btn-outline" onclick="cancelEdit()">&#10005; Cancel</button>',
        '<button class="btn btn-success" id="confirm-btn" onclick="confirmChanges()">&#10003; Confirm Changes</button>'
      ].join('');
    }

    function cancelEdit() {
      window._editing = false;
      window._deltas = {};
      refreshProductList();
      var fab = $('#add-product-fab');
      if (fab) fab.style.display = '';
      var bar = $('#action-bar');
      if (bar) bar.innerHTML = '<button class="btn btn-primary" id="checkout-btn" onclick="enterEditMode()">&#9998; Checkout / Update Stock</button>';
    }

    function refreshProductList() {
      var list = $('#product-list');
      if (!list) return;
      list.innerHTML = window._boxData.products.map(function (p, i) { return renderProductRow(p, i, window._editing); }).join('');
    }

    function adjustDelta(index, dir) {
      if (!window._deltas) window._deltas = {};
      var product = window._boxData.products[index];
      var newDelta = (window._deltas[index] || 0) + dir;
      var newQty = product.qty + newDelta;
      if (newQty < 0) return;
      window._deltas[index] = newDelta;
      var counterEl = $('#counter-' + index);
      if (counterEl) { counterEl.textContent = newQty; counterEl.className = 'counter-val ' + qtyClass(newQty); }
    }

    async function confirmChanges() {
      var boxId = window._boxData.boxId;
      var products = window._boxData.products;
      var deltas = window._deltas || {};
      var updates = [];
      products.forEach(function (p, i) {
        if (deltas[i] && deltas[i] !== 0) {
          updates.push({ name: p.name, newQty: p.qty + deltas[i] });
        }
      });

      if (updates.length === 0) { toast('No changes to save', 'info'); return; }

      var btn = $('#confirm-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving&hellip;'; }
      toast('Saving changes&hellip;', 'loading');

      try {
        var res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'update', boxId: boxId, updates: updates }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var result = await res.json();
        if (result.error) throw new Error(result.error);

        products.forEach(function (p, i) { if (deltas[i]) p.qty += deltas[i]; });
        _allInventory = null; // invalidate search cache
        toast(updates.length + ' item' + (updates.length > 1 ? 's' : '') + ' updated', 'success');
        cancelEdit();
      } catch (err) {
        toast('Error: ' + err.message, 'error');
        if (btn) { btn.disabled = false; btn.innerHTML = '&#10003; Confirm Changes'; }
      }
    }

    /* ─────────────────────────────────────────────
       ADD PRODUCT
    ───────────────────────────────────────────── */
    var _addProductBoxId = '';

    function openAddProductSheet(boxId, location) {
      _addProductBoxId = boxId;
      $('#sheet-box-label').textContent = 'Adding to ' + boxId + (location ? ' \u2022 ' + location : '');
      $('#ap-name').value = '';
      $('#ap-qty').value = '0';
      openModal('add-product-sheet');
      setTimeout(function () { $('#ap-name').focus(); }, 350);
    }

    async function submitAddProduct() {
      var name = $('#ap-name').value.trim();
      var qty = parseInt($('#ap-qty').value, 10);

      if (!name) { $('#ap-name').focus(); toast('Product name is required', 'error'); return; }
      if (isNaN(qty) || qty < 0) { $('#ap-qty').focus(); toast('Enter a valid quantity', 'error'); return; }

      // Check for duplicate product name in this box
      if (window._boxData) {
        var existing = window._boxData.products.find(function (p) {
          return p.name.toLowerCase() === name.toLowerCase();
        });
        if (existing) { toast('Product "' + name + '" already exists in this box', 'error'); return; }
      }

      var btn = $('#ap-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span> Adding&hellip;';
      toast('Adding product&hellip;', 'loading');

      try {
        var res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'addProduct',
            boxId: _addProductBoxId,
            location: window._boxData ? window._boxData.location : '',
            name: name,
            qty: qty,
          }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var result = await res.json();
        if (result.error) throw new Error(result.error);

        // Optimistically add to local product list
        if (window._boxData) {
          window._boxData.products.push({ name: name, qty: qty });
          refreshProductList();
          // Update badge
          var badge = document.querySelector('.badge-green');
          if (badge) badge.innerHTML = '&#128230; ' + window._boxData.products.length + ' Product' + (window._boxData.products.length !== 1 ? 's' : '');
        }

        _allInventory = null; // invalidate search cache
        closeModal();
        toast('Product added: ' + name, 'success');
      } catch (err) {
        toast('Error: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '&#43; Add Product';
      }
    }

    /* ─────────────────────────────────────────────
       BOOT
    ───────────────────────────────────────────── */
    route();
  </script>
</body>

</html>
